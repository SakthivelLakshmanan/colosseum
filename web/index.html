<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colosseum Decision Room</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="Colosseum: six AI advisers argue a business decision, a moderator checks every claim, and a named person signs off.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1A20'/%3E%3Cpath d='M12 44a20 20 0 0 1 40 0' fill='none' stroke='%23D9AE63' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M20 44a12 12 0 0 1 24 0' fill='none' stroke='%234FD8FF' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app idle" id="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--panel-2)"/><path d="M12 44a20 20 0 0 1 40 0" fill="none" stroke="var(--laurel)" stroke-width="5" stroke-linecap="round"/><path d="M20 44a12 12 0 0 1 24 0" fill="none" stroke="var(--signal)" stroke-width="5" stroke-linecap="round"/></svg>
      <b>COLOSSEUM</b>
    </div>
    <div class="crumb"><span class="id" id="crumbId"></span><span class="t" id="crumbT">AI debate room for enterprise decisions</span></div>
    <span class="mode" id="mode">Sample run</span>
    <select class="picker" id="picker" aria-label="Open a saved run"></select>
    <button class="btn primary" id="newBtn" type="button">New decision</button>
  </header>

  <main class="stage" id="stage">
    <div class="sweep" aria-hidden="true"></div>
    <div class="title">
      <h1 id="question">Bring a decision to the arena.</h1>
      <div class="opts" id="opts"></div>
      <button class="brief-link" type="button" data-sheet="brief" id="briefLink">Read the full brief</button>
    </div>
    <div class="sess" role="status" aria-live="polite">
      <span class="st"><i></i><span id="sessState">Arena idle</span></span>
      <span class="dt" id="sessDetail">No debate in session</span>
      <span class="clk tabnum" id="clock">0:00</span>
      <button class="btn" type="button" id="replayBtn" title="Plays the whole run again, step by step" style="margin-top:6px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Replay the debate</button>
    </div>
    <div class="arena-box" id="arenaBox">
      <svg id="arena" viewBox="0 0 1200 640" role="img" aria-label="Advisers seated around the decision"></svg>
      <div class="bubbles" id="bubbles"></div>
    </div>

    <aside class="side" id="side" aria-label="Details">
      <div class="side-h"><button class="btn ghost x" id="sideBack" type="button" aria-label="Back" hidden>←</button><b id="sideTitle">Details</b><button class="btn ghost x" id="sideClose" type="button" aria-label="Close panel">✕</button></div>
      <div class="side-b" id="sideBody"></div>
    </aside>
  </main>

  <footer class="dock">
    <div class="dockwrap"><span class="path-cap" id="pathCap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8"/></svg>Each finished step opens its detail. Click one.</span>
    <nav class="path" id="path" aria-label="Decision path: open any finished step"></nav></div>

  </footer>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheetTitle">
  <div class="sheet-h"><h2 id="sheetTitle">Details</h2><p id="sheetSub"></p><button class="btn ghost x" id="sheetClose" type="button" aria-label="Close">✕</button></div>
  <div class="sheet-b" id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
